[package]
name = "orbit-launcher"
version = "0.8.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/azukihoney/orbit-launcher"
publish = false

[features]
default = []
review-test = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com",
    "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem", "Win32_System_Ole"
    ,"Win32_Security", "Win32_Security_Cryptography", "Win32_Globalization"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
